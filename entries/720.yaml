  github: Ywach404
  name: "A.Cervantez"
status: partially-working
status_notes: "Xbox 360 emulator (XeniOS port) on the headset. Needs Apparition on a Mac at every launch for JIT and a paid developer account. Marble Blast Ultra and Beautiful Katamari at about 60 fps, Halo 3 about 30 once shaders are cached, Fable II 25 to 29 with rendering faults."
visionos_min: "26.0"
input: [game-controller]
experiences: [2d]
install: [build]
description: "As far as I can find, the first standalone, JIT based Xbox 360 emulator on Apple Vision Pro, and a sibling to Xbawks, my original Xbox emulator. A port of XeniOS with a visionOS shell: the game on a big screen in your room, JIT through Apparition, Sense or gamepad input. Bring your own games."
